<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualcomm PMIC SID数据查询</title>
    <style>
        /* ========================================
                   1. 全局样式与CSS变量
                   ======================================== */
        :root {
            --primary: #1a2639; /* 主色调：深蓝黑 */
            --primary-light: #2c3e50;
            --accent: #3b82f6; /* 强调色：亮蓝 */
            --accent-hover: #2563eb;
            --bg: #f1f5f9; /* 页面背景：浅灰蓝 */
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 20px;
            line-height: 1.6;
        }

        /* ========================================
                   2. 登录界面
                   ======================================== */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 38, 57, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card);
            padding: 44px 40px 36px;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            width: 380px;
            max-width: 92vw;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box .logo-icon {
            font-size: 42px;
            margin-bottom: 4px;
        }

        .login-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-box .sub {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 13px 16px;
            margin: 6px 0 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fafbfc;
            transition: border-color var(--transition), box-shadow var(--transition);
            box-sizing: border-box;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: #fff;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), transform 0.15s;
            margin-top: 8px;
        }

        .login-box button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .login-box button:active {
            transform: translateY(0);
        }

        .login-error {
            color: #ef4444;
            font-size: 13px;
            height: 20px;
            margin-top: 6px;
        }

        /* ========================================
                   3. 主界面布局
                   ======================================== */
        #main-app {
            max-width: 1400px;
            margin: 0 auto;
            display: none;
            animation: fadeUp 0.4s ease;
        }

        /* ---- 顶部栏 ---- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 20px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 28px;
        }

        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .top-bar .brand span {
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .user-info strong {
            color: var(--text);
            font-weight: 600;
        }

        .logout-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }

        .logout-btn:hover {
            background: #fecaca;
            color: #b91c1c;
        }

        /* ---- 页面标题 ---- */
        .page-title {
            text-align: center;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .page-title strong {
            font-weight: 600;
            color: var(--accent);
        }

        .page-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* ---- 导航标签 ---- */
        .nav-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
        }

        .nav-btn {
            background: var(--card);
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 30px;
            transition: all var(--transition);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.12);
        }

        .nav-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
            transform: translateY(-2px);
        }

        .nav-btn.external {
            background: transparent;
            border-style: dashed;
            color: var(--text-muted);
        }

        .nav-btn.external:hover {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }

        /* ---- 内容区 ---- */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ========================================
                   4. 卡片与表格
                   ======================================== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px 28px;
            overflow: hidden;
            transition: box-shadow var(--transition);
        }

        .card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg);
        }

        .section-title .badge {
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 0 12px;
            border-radius: 20px;
            line-height: 24px;
        }

        /* ---- 表格通用 ---- */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 480px;
        }

        th {
            background: #f8fafc;
            color: var(--primary);
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border);
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        td {
            padding: 11px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        /* ---- PMIC 列表表格 ---- */
        .pmic-model {
            font-weight: 600;
            color: var(--primary);
        }

        .pmic-id {
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 13px;
			font-weight: 600;
            background: #e0f2fe;
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
            color: var(--primary-light);
        }

        .slave-id {
            font-family: "SF Mono", "Menlo", monospace;
            
            color: #b45309;
            background: #fffbeb;
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
            font-size: 13px;
			font-weight: 600;
        }

        .bus-id {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }

        .doc-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            margin-left: 6px;
            opacity: 0.7;
            transition: opacity var(--transition);
        }

        .doc-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* ---- 寄存器表格 ---- */
        .reg-pmic-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .pmic-tag {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .reg-addr {
            font-family: "SF Mono", "Menlo", monospace;
            color: #1e40af;
            font-weight: 600;
            background: #eff6ff;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
        }

        .reg-name {
            font-weight: 500;
            color: var(--primary);
        }

        /* ---- 空状态 ---- */
        .no-result {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .no-result .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ========================================
                   5. 响应式
                   ======================================== */
        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 16px;
            }

            .top-bar .brand {
                justify-content: center;
            }

            .user-info {
                justify-content: center;
                flex-wrap: wrap;
            }

            .page-title {
                font-size: 20px;
            }

            .card {
                padding: 18px 16px 20px;
            }

            .nav-btn {
                padding: 8px 20px;
                font-size: 14px;
            }

            table {
                font-size: 13px;
                min-width: 360px;
            }

            th,
            td {
                padding: 10px 12px;
            }

            .login-box {
                padding: 32px 24px 28px;
                width: 94vw;
            }
        }

        @media (max-width: 480px) {
            .nav-btn {
                padding: 6px 14px;
                font-size: 13px;
            }

            .pmic-id,
            .slave-id,
            .bus-id,
            .reg-addr {
                font-size: 12px;
                padding: 1px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================
    登录界面
    ======================================== -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="logo-icon">🔐</div>
            <h2>PMIC 数据查询</h2>
            <p class="sub">Qualcomm 电源管理芯片寄存器信息</p>
            <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
            <input type="password" id="password" placeholder="请输入密码">
            <button onclick="handleLogin()">登 录</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <!-- ========================================
    主界面
    ======================================== -->
    <div id="main-app">

        <!-- 顶部栏 -->
        <header class="top-bar">
            <div class="brand">
                ⚡ PMIC SID 查询
                <span>v1.0</span>
            </div>
            <div class="user-info">
                <span>👤 当前用户：<strong id="current-user"></strong></span>
                <button class="logout-btn" onclick="handleLogout()">退出登录</button>
            </div>
        </header>

        <!-- 标题 -->
        <h1 class="page-title">Qualcomm <strong>PMIC</strong> SID 数据查询</h1>
        <!-- <p class="page-sub">浏览 PMIC 标识符、总线地址及寄存器基地址</p> -->

        <!-- 导航标签 -->
        <nav class="nav-container">
            <button class="nav-btn" onclick="switchTab('SM8750')">SM8750</button>
            <button class="nav-btn" onclick="switchTab('SM8850')">SM8850</button>
            <button class="nav-btn active" onclick="switchTab('SM8950')">SM8950</button>
            <a href="https://dargon-lab.github.io/qc-ocp-check/" class="nav-btn" target="_blank">OCP-Check</a>
        </nav>

        <!-- 内容区域 -->
        <div class="content-wrapper" id="content-area"></div>
    </div>

    <!-- ========================================
    JavaScript 逻辑
    ======================================== -->
    <script>
        /**
         * =============================================
         * 1. 登录与鉴权
         * =============================================
         * 使用 sessionStorage 保存登录状态，
         * 支持 Enter 键快速登录。
         */
        const validUsers = {
            "liangshuai": "123456",
			"1234": "",
            "hanyuekun": "123456"
        };

        /** 处理登录按钮点击 */
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            if (validUsers[user] && validUsers[user] === pass) {
                sessionStorage.setItem('loggedInUser', user);
                showApp(user);
            } else {
                errorEl.innerText = '账号或密码错误，请重试';
            }
        }

        /** 退出登录，清除 session 并回到登录界面 */
        function handleLogout() {
            sessionStorage.removeItem('loggedInUser');
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-error').innerText = '';
        }

        /** 显示主应用，并初始化当前用户信息 */
        function showApp(username) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('current-user').innerText = username;
            // 默认加载 SM8950 数据
            switchTab('SM8950');
        }

        /** 页面加载时自动恢复登录状态 */
        window.onload = function() {
            const user = sessionStorage.getItem('loggedInUser');
            if (user && validUsers[user]) {
                showApp(user);
            }
        };

        /** 密码框按 Enter 触发登录 */
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        /**
         * =============================================
         * 2. 数据仓库
         * =============================================
         * db 对象按芯片平台（SM8750 / SM8850 / SM8950）组织，
         * 每个平台包含：
         *   - pmicList : PMIC 标识符及总线信息
         *   - registers: 各 PMIC 的寄存器列表（名称 + 基地址）
         */
        const db = {

            // -------- SM8950 --------
            "SM8950": {
                pmicList: [
                    { pmic: "PMK8950", id: "PMIC_A_E0", bus: "0", slave: "0x0", link: "#" },
                    { pmic: "PMH0101", id: "PMIC_B_E0", bus: "0", slave: "0x1", link: "#" },
                    { pmic: "PMH0104", id: "PMIC_C_E0", bus: "0", slave: "0x2", link: "#" },
                    { pmic: "PMH0110", id: "PMIC_D_E0", bus: "0", slave: "0x3", link: "#" },
                    { pmic: "PMD802x", id: "PMIC_E_E1", bus: "1", slave: "0x4", link: "#" },
                    { pmic: "PMH0110", id: "PMIC_F_E0", bus: "0", slave: "0x5", link: "#" },
                    { pmic: "PMH0110", id: "PMIC_G_E0", bus: "0", slave: "0x6", link: "#" },
                    { pmic: "PMIH010x", id: "PMIC_H_E1", bus: "1", slave: "0x7", link: "#" },
                    { pmic: "PMH0110", id: "PMIC_I_E0", bus: "0", slave: "0x8", link: "#" },
                    { pmic: "PMG1110", id: "PMIC_J_E1", bus: "1", slave: "0x9", link: "#" },
                    { pmic: "PMR735D", id: "PMIC_K_E1", bus: "1", slave: "0xA", link: "#" },
                    { pmic: "PM8010", id: "PMIC_M_E1", bus: "1", slave: "0xC", link: "#" },
                    { pmic: "PM8010", id: "PMIC_N_E1", bus: "1", slave: "0xD", link: "#" }
                ],
                registers: {
                    "PMH0101": {
                        link: "https://docs.qualcomm.com/doc/HRD-PMH0101-S1/topic/BUS.html",
                        regs: [
                            { name: "LDO01", addr: "0x0000C100" }, { name: "LDO02", addr: "0x0000C200" },
                            { name: "LDO03", addr: "0x0000C300" }, { name: "LDO04", addr: "0x0000C400" },
                            { name: "LDO05", addr: "0x0000C500" }, { name: "LDO06", addr: "0x0000C600" },
                            { name: "LDO07", addr: "0x0000C700" }, { name: "LDO08", addr: "0x0000C800" },
                            { name: "LDO09", addr: "0x0000C900" }, { name: "LDO10", addr: "0x0000CA00" },
                            { name: "LDO11", addr: "0x0000CB00" }, { name: "LDO12", addr: "0x0000CC00" },
                            { name: "LDO13", addr: "0x0000CD00" }, { name: "LDO14", addr: "0x0000CE00" },
                            { name: "LDO15", addr: "0x0000CF00" }, { name: "LDO16", addr: "0x0000D000" },
                            { name: "LDO17", addr: "0x0000D100" }, { name: "BOB1", addr: "0x0000E400" },
                            { name: "BOB2", addr: "0x0000E600" }, { name: "CBST", addr: "0x00009A00" }
                        ]
                    },
                    "PMH0110": {
                        link: "https://docs.qualcomm.com/doc/HRD-PMH0110-S1/topic/BUS.html",
                        regs: [
                            { name: "LDO01", addr: "0x0000C100" }, { name: "LDO02", addr: "0x0000C200" },
                            { name: "LDO03", addr: "0x0000C300" }, { name: "LDO04", addr: "0x0000C400" },
                            { name: "S1", addr: "0x00009B00" }, { name: "S2", addr: "0x00009E00" },
                            { name: "S3", addr: "0x0000A100" }, { name: "S4", addr: "0x0000A400" },
                            { name: "S5", addr: "0x0000A700" }, { name: "S6", addr: "0x0000AA00" },
                            { name: "S7", addr: "0x0000AD00" }, { name: "S8", addr: "0x0000B000" },
                            { name: "S9", addr: "0x0000B300" }, { name: "S10", addr: "0x0000B600" }
                        ]
                    },
                    "PMH0104": {
                        link: "https://docs.qualcomm.com/doc/HRD-PMH0104-S1/topic/SPMI.html",
                        regs: [
                            { name: "S1", addr: "0x00009B00" }, { name: "S2", addr: "0x00009E00" },
                            { name: "S3", addr: "0x0000A100" }, { name: "S4", addr: "0x0000A400" }
                        ]
                    },
                    "PMG1110": {
                        link: "https://docs.qualcomm.com/doc/HRD-PMG1110-S/topic/BUS.html",
                        regs: [
                            { name: "S1", addr: "0x00009B00" }
                        ]
                    },
                    "PM8010": {
                        link: "https://docs.qualcomm.com/doc/HRD-PM8010-S/topic/SPMI.html",
                        regs: [
                            { name: "LDO01", addr: "0x00004000" }, { name: "LDO02", addr: "0x00004100" },
                            { name: "LDO03", addr: "0x00004200" }, { name: "LDO04", addr: "0x00004300" },
                            { name: "LDO05", addr: "0x00004400" }, { name: "LDO06", addr: "0x00004500" },
                            { name: "LDO07", addr: "0x00004600" }
                        ]
                    },
                    "PMR735D": {
                        link: "https://docs.qualcomm.com/doc/HRD-PMR735D-S/topic/",
                        regs: [
                            { name: "LDO01", addr: "0x0000C100" }, { name: "LDO02", addr: "0x0000C200" },
                            { name: "LDO03", addr: "0x0000C300" }, { name: "LDO04", addr: "0x0000C400" },
                            { name: "LDO05", addr: "0x0000C500" }, { name: "LDO06", addr: "0x0000C600" },
                            { name: "LDO07", addr: "0x0000C700" }
                        ]
                    }
                }
            },

            // -------- SM8750 --------
            "SM8750": {
                pmicList: [
                    { pmic: "PMK8750", id: "PMIC_A_E0", bus: "0", slave: "0x0", link: "#" },
                    { pmic: "PM8550", id: "PMIC_B_E0", bus: "0", slave: "0x1", link: "#" },

         * =============================================
         * 3. 渲染引擎
         * =============================================
         * 当前选中的芯片平台由 currentSheet 维护，
         * switchTab() 切换平台并触发重绘，
         * renderContent() 负责构建 DOM 并填充数据。
         */
        let currentSheet = 'SM8950';

        /** 切换芯片平台标签 */
        function switchTab(sheetName) {
            currentSheet = sheetName;
            // 更新导航按钮激活状态
            document.querySelectorAll('.nav-btn:not(.external)').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === sheetName) btn.classList.add('active');
            });
            renderContent();
        }

        /** 渲染当前平台的全部数据（PMIC 列表 + 寄存器表格） */
        function renderContent() {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            const data = db[currentSheet];
            if (!data) {
                container.innerHTML = `
                            <div class="no-result">
                                <span class="icon">📭</span>
                                <p>${currentSheet} 数据暂未录入</p>
                            </div>`;
                return;
            }

            // ---------- 1) 渲染 PMIC 列表 ----------
            const listCard = document.createElement('div');
            listCard.className = 'card';

            let listHtml = `
                        <div class="section-title">
                            📋 PMIC 标识符与总线信息
                            <span class="badge">${data.pmicList.length} 个</span>
                        </div>
                        <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>PMIC 型号</th>
                                    <th>PMIC Identifier</th>
                                    <th>BUS ID</th>
                                    <th>Slave ID</th>
                                </tr>
                            </thead>
                            <tbody>`;

            data.pmicList.forEach(row => {
                const linkIcon = row.link && row.link !== '#' ?
                    `<a href="${row.link}" target="_blank" class="doc-link" title="查看 Datasheet">🔗 文档</a>` :
                    '';
                listHtml += `
                            <tr>
                                <td><span class="pmic-model">${row.pmic}</span></td>
                                <td><span class="pmic-id">${row.id}</span> ${linkIcon}</td>
                                <td><span class="bus-id">${row.bus}</span></td>
                                <td><span class="slave-id">${row.slave}</span></td>
                            </tr>`;
            });

            listHtml += `
                            </tbody>
                        </table>
                        </div>`;
            listCard.innerHTML = listHtml;
            container.appendChild(listCard);

            // ---------- 2) 渲染寄存器表格（按 PMIC 分组） ----------
            const regEntries = Object.entries(data.registers);
            if (regEntries.length === 0) {
                container.innerHTML += `
                            <div class="no-result">
                                <span class="icon">📄</span>
                                <p>该平台暂无寄存器数据</p>
                            </div>`;
                return;
            }

            // 按 PMIC 名称排序，使输出有序
            regEntries.sort((a, b) => a[0].localeCompare(b[0]));

            for (const [pmicName, pmicData] of regEntries) {
                const regs = pmicData.regs;
                if (!regs || regs.length === 0) continue;

                const card = document.createElement('div');
                card.className = 'card';

                let tableHtml = `
                            <div class="reg-pmic-header">
                                <span class="pmic-tag">${pmicName}</span>
                                ${pmicData.link && pmicData.link !== '#' ?
                                    `<a href="${pmicData.link}" target="_blank" class="doc-link" style="opacity:1;">📖 查看规格书</a>` :
                                    ''}
                                <span style="margin-left:auto;font-size:13px;color:var(--text-muted);">${regs.length} 个寄存器</span>
                            </div>
                            <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:35%;">模块名称</th>
                                        <th style="width:65%;">基地址 (Base Address)</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                for (const r of regs) {
                    tableHtml += `
                                <tr>
                                    <td><span class="reg-name">${r.name}</span></td>
                                    <td><span class="reg-addr">${r.addr}</span></td>
                                </tr>`;
                }

                tableHtml += `
                                </tbody>
                            </table>
                            </div>`;
                card.innerHTML = tableHtml;
                container.appendChild(card);
            }
        }
